<!-- Dashboard Page Content -->
<div id="dashboard" class="page-container">
    <section class="container">
        <h2 class="section-title">User Dashboard</h2>

        <!-- User Profile Section -->
        <div class="row mb-4">
            <div class="col-lg-4">
                <div class="card-custom">
                    <div class="card-body text-center">
                        <div class="user-avatar mb-3">
                            <i class="fas fa-user fa-3x"></i>
                        </div>
                        <h4 id="userDisplayName">Guest User</h4>
                        <p id="userDisplayEmail">Not logged in</p>
                        <div id="loginSection">
                            <button class="btn btn-primary" data-bs-toggle="modal"
                                data-bs-target="#loginModal">Login</button>
                            <button class="btn btn-outline-primary ms-2" data-bs-toggle="modal"
                                data-bs-target="#registerModal">Register</button>
                        </div>
                        <div id="userSection" style="display: none;">
                            <button class="btn btn-outline-danger" onclick="logout()">Logout</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card-custom">
                    <div class="card-body">
                        <h4>Quick Stats</h4>
                        <div class="row">
                            <div class="col-md-3 text-center">
                                <h5 class="text-primary">15</h5>
                                <p>Applications</p>
                            </div>
                            <div class="col-md-3 text-center">
                                <h5 class="text-success">8</h5>
                                <p>Interviews</p>
                            </div>
                            <div class="col-md-3 text-center">
                                <h5 class="text-warning">3</h5>
                                <p>Pending</p>
                            </div>
                            <div class="col-md-3 text-center">
                                <h5 class="text-info">2</h5>
                                <p>Offers</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Favorites Section -->
        <div class="row">
            <div class="col-12">
                <div class="card-custom">
                    <div class="card-body">
                        <h4>Your Favorite Jobs</h4>
                        <div id="favoriteJobs">
                            <p class="text-muted">No favorite jobs yet. Browse our careers page to save jobs!</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Daily Quote Section -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card-custom quote-card">
                    <div class="card-body text-center">
                        <h4>Daily Inspiration</h4>
                        <div id="quoteContainer">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Loading quote...</span>
                            </div>
                        </div>
                        <button class="btn btn-outline-primary mt-3" onclick="loadNewQuote()">New Quote</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
